<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="128" height="128" fill="#1a1a2e"/>
    
    <!-- Swirling pattern -->
    <g transform="translate(64, 64)">
        <path d="M0 0 Q 32 32 0 64 T -64 0 T 0 -64 T 64 0" 
              fill="none" 
              stroke="#e94560" 
              stroke-width="8" 
              opacity="0.8"/>
        
        <!-- Rotating triangles -->
        <g transform="rotate(45)">
            <polygon points="0,0 20,-40 -20,-40" fill="#0f3460" opacity="0.7"/>
            <polygon points="0,0 -20,40 20,40" fill="#16213e" opacity="0.7"/>
        </g>
        
        <!-- Inner circles -->
        <circle r="20" fill="none" stroke="#ff577f" stroke-width="4" opacity="0.6"/>
        <circle r="12" fill="#4ea8de" opacity="0.5"/>
        
        <!-- Outer accents -->
        <g transform="rotate(90)">
            <path d="M40 0 A 40 40 0 0 1 0 40" 
                  fill="none" 
                  stroke="#54e346" 
                  stroke-width="3" 
                  opacity="0.7"/>
        </g>
    </g>
    
    <!-- Small decorative elements -->
    <circle cx="20" cy="20" r="4" fill="#fff591" opacity="0.8"/>
    <rect x="108" y="108" width="8" height="8" fill="#fff591" opacity="0.8"/>
</svg>